version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - revive

  settings:
    revive:
      rules:
        - name: exported
          severity: warning

  exclusions:
    rules:
      # Skeleton stubs take their ports as constructor arguments and do not use
      # them yet. Remove this exclusion once the phases that implement them land.
      - path: internal/application/(deliver|expire)/service\.go
        linters:
          - unused
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
