name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Same gate developers run locally and the same one Archon workflow
      # nodes call: gofmt, vet, build, tests, example-config validation.
      - name: make validate
        run: make validate

      - name: make test-release
        run: make test-release

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: make test-e2e
        run: make test-e2e

  image:
    name: image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.3.0

      - name: Select image creation time
        id: image-created
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build without pushing
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
            CREATED=${{ steps.image-created.outputs.value }}
          tags: flowstitch:ci
          push: false
