# Optional example input (`docker compose --profile input up`). FlowStitch does
# not depend on Fluent Bit; any client that POSTs JSON to /v1/events works.
[SERVICE]
    Flush         1
    Log_Level     info

[INPUT]
    Name          dummy
    Tag           flowstitch.demo
    Dummy         {"event":"log.message","flow_id":"fluent-bit-demo","datetime":"2026-08-21T12:00:00.000Z","message":"hello from Fluent Bit"}
    Interval_sec  10
    Samples       1
    Flush_on_startup true

[OUTPUT]
    Name          http
    Match         flowstitch.*
    Host          flowstitch
    Port          8080
    URI           /v1/events
    Format        json_stream
    Header        Content-Type application/json
